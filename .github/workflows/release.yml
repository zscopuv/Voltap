
name: Build and Release Voltap

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ./Voltap/Voltap.csproj

      - name: Publish Windows executable
        run: >
          dotnet publish ./Voltap/Voltap.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o ./publish

      - name: Package release
        shell: pwsh
        run: |
          Compress-Archive `
            -Path ./publish/* `
            -DestinationPath ./Voltap-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Voltap ${{ github.ref_name }}
          generate_release_notes: true
          files: Voltap-${{ github.ref_name }}-win-x64.zip
